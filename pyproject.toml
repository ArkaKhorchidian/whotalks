[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "whotalks"
version = "0.1.0"
description = "Who does your computer talk to? Watches outbound connections for a minute and groups them by company and app, with a privacy grade. No root needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "psutil>=5.9"]
keywords = ["privacy", "network", "connections", "tracking", "netstat", "asn", "telemetry", "security", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
whotalks = "whotalks.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/whotalks"
Issues = "https://github.com/ArkaKhorchidian/whotalks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whotalks"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
